<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nido</title>
<meta name="description" content="El hogar de Pau y Fede">
<meta name="theme-color" content="#F4F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18141F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell, sticky top bar + floating bottom tab bar; on wide screens the week grid opens into columns. */
:root{
  --bg:#F4F1FA; --paper:#FFFFFF; --ink:#2A2240; --ink-2:#6A6185; --line:#E4DEF0; --soft:#ECE7F6;
  --violet:#7A4FD3; --violet-ink:#FFFFFF; --tomato:#F0644B; --sun:#F6C445; --frog:#7DB64A; --gum:#EF8BB3; --sky:#7F9BE0; --teal:#3BBDAE;
  --ok:#3E9B5B; --warn:#D98A1E;
  --shadow:0 1px 0 rgba(42,34,64,.06), 0 8px 24px -12px rgba(42,34,64,.25);
  --f-display:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18141F; --paper:#231D2E; --ink:#F1ECFA; --ink-2:#A79FBD; --line:#352D44; --soft:#2C2539;
  --violet:#A584F0; --violet-ink:#1A1424; --ok:#6CC488; --warn:#F0B055;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18141F; --paper:#231D2E; --ink:#F1ECFA; --ink-2:#A79FBD; --line:#352D44; --soft:#2C2539;
  --violet:#A584F0; --violet-ink:#1A1424; --ok:#6CC488; --warn:#F0B055;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.top .sp{flex:1}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-weight:600}
.me-btn svg{width:32px;height:32px}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:4px 10px;border-radius:999px}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:2px;background:var(--paper);padding:6px;border-radius:26px;box-shadow:0 12px 30px -10px rgba(42,34,64,.45);width:min(540px,calc(100% - 20px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 1px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ink-2)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--soft);color:var(--violet)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border-radius:22px;background:var(--violet);color:var(--violet-ink);box-shadow:0 12px 24px -8px color-mix(in srgb,var(--violet) 70%,transparent);display:grid;place-items:center;transition:transform .15s}
.fab:hover{transform:rotate(-6deg) scale(1.04)}
.fab svg{width:28px;height:28px}

/* generic */
.sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h2{font-size:21px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--violet);color:var(--violet-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;border-radius:11px;font-size:13px}
.btn.danger{color:var(--tomato)}
.btn svg{width:18px;height:18px}
.chip{padding:7px 12px;border-radius:999px;background:var(--soft);font-weight:600;font-size:13.5px;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--violet) 16%,var(--paper));border-color:var(--violet);color:var(--ink)}
.chip svg{width:20px;height:20px}
.empty{padding:18px;border:2px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center;font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

/* hero / greeting */
.hello{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:8px}
.hello svg.char{width:76px;height:76px}
.hello>button{border-radius:50%;padding:0}
.hello h1{font-size:30px;line-height:1.1}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.score .p{border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:10px;color:#2A2240}
.score .p svg{width:46px;height:46px;flex:none}
.score .n{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.bal{margin-top:10px}
.bal-bar{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--soft)}
.bal-bar span{display:block;height:100%;transition:width .5s}
.bal-note{font-size:13px;color:var(--ink-2);margin-top:6px}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);position:relative;border-left:6px solid var(--tc,var(--line))}
.task[draggable="true"]{cursor:grab}
.task .who{display:flex;flex:none}
.task .who svg{width:30px;height:30px}
.task .who svg+svg{margin-left:-10px}
.task .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task .m{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.task.done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.task.done{opacity:.78}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--paper);transition:transform .15s}
.check:hover{transform:scale(1.08)}
.check svg{width:22px;height:22px;opacity:0}
.task.done .check{background:var(--sun);border-color:var(--sun)}
.task.done .check svg{opacity:1}
.stars{color:var(--sun);letter-spacing:-1px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.pill.late{background:color-mix(in srgb,var(--tomato) 15%,transparent);color:var(--tomato)}

/* week */
.week-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-h h2{font-size:21px;flex:1;min-width:150px}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.day{background:color-mix(in srgb,var(--paper) 55%,transparent);border:1.5px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:background .15s,border-color .15s}
.day.today{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 7%,var(--paper))}
.day.over{border-color:var(--violet);border-style:dashed;background:color-mix(in srgb,var(--violet) 12%,var(--paper))}
.day-h{display:flex;align-items:center;gap:8px}
.day-h b{font-family:var(--f-display);font-size:17px;font-weight:600}
.day-h .d{color:var(--ink-2);font-size:13px}
.load{margin-left:auto;display:flex;gap:6px}
.load span{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2)}
.load i{width:9px;height:9px;border-radius:50%;display:inline-block}
.add-day{font-size:13px;font-weight:600;color:var(--ink-2);padding:6px;border-radius:12px;text-align:left}
.add-day:hover{background:var(--soft);color:var(--ink)}
.queue{margin-top:18px}

/* suggestions */
.sugg{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--sun) 22%,var(--paper))}
.sugg svg.char{width:44px;height:44px;flex:none}
.sugg p{margin:0 0 8px}
.sugg.ai{background:color-mix(in srgb,var(--sky) 20%,var(--paper))}

/* shopping */
.shop-add{display:flex;gap:8px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper)}
.inp:focus{outline:none;border-color:var(--violet)}
textarea.inp{min-height:110px;resize:vertical}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow)}
.item .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;text-align:left}
.item svg.char{width:26px;height:26px;flex:none}
.item .box{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center}
.item .box svg{width:16px;height:16px;opacity:0}
.item.got .box{background:var(--frog);border-color:var(--frog)}
.item.got .box svg{opacity:1}
.item.got .nm{text-decoration:line-through;color:var(--ink-2)}
.x{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--soft)}
.x svg{width:16px;height:16px}

/* reminders */
.rem{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow)}
.rem .time{font-family:var(--f-display);font-size:24px;font-weight:600;min-width:70px}
.rem .tx{flex:1;min-width:0}
.rem .tx p{margin:0;font-weight:600;overflow-wrap:anywhere}
.rem.off{opacity:.55}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{left:21px}
.next-rem{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--teal) 18%,var(--paper))}
.next-rem svg.char{width:44px;height:44px;flex:none}

/* stickers */
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:1000px){.album{grid-template-columns:repeat(5,minmax(0,1fr))}}
.stk{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);position:relative}
.stk svg{width:86px;height:86px}
.stk b{font-size:13px;line-height:1.2}
.stk small{font-size:11.5px;color:var(--ink-2);line-height:1.25}
.stk.locked svg{filter:grayscale(1);opacity:.32}
.stk .cnt{position:absolute;top:8px;right:8px;background:var(--violet);color:var(--violet-ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.prof .card{display:flex;flex-direction:column;gap:10px}
.prof .head{display:flex;align-items:center;gap:12px}
.prof .head svg{width:64px;height:64px}
.prof .head h3{font-size:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(24,18,36,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px}}
.sheet h2{font-size:23px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.sheet-foot .sp{flex:1}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pick-grid button{border-radius:16px;padding:6px;border:2px solid transparent;background:var(--soft)}
.pick-grid button[aria-pressed="true"]{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,var(--paper))}
.pick-grid svg{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--violet)}

/* claim */
.claim{max-width:520px;margin:40px auto 0;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.claim h1{font-size:34px}
.claim .opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.claim .opt{background:var(--paper);box-shadow:var(--shadow);border-radius:24px;padding:16px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:20px;font-weight:600}
.claim .opt svg{width:90px;height:90px}
.claim .opt:disabled{opacity:.4;cursor:not-allowed}

/* toast + burst */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;box-shadow:var(--shadow);animation:up .25s;max-width:calc(100% - 32px)}
.burst{position:fixed;z-index:40;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.wiggle{animation:wig 2.8s ease-in-out infinite;transform-origin:50% 80%}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2: energy, thanks, ownership, summary */
.sec-h{flex-wrap:wrap}
.pill.gest{background:color-mix(in srgb,var(--sky) 22%,transparent);color:var(--ink)}
.crown{width:14px;height:14px;vertical-align:-2px}
.thx-btn{flex:none;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--gum) 24%,var(--paper));color:var(--ink);display:inline-flex;gap:4px;align-items:center}
.thx-btn svg{width:14px;height:14px}
.thx-btn.got{background:transparent;border:1.5px solid color-mix(in srgb,var(--gum) 60%,transparent)}
.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mood-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;border:2px solid transparent}
.mood-b svg{width:44px;height:44px}
.mood-b[aria-pressed="true"]{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,var(--paper))}
.mood-other{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.mood-other svg{width:28px;height:28px;flex:none}
.wide{width:100%}
.month-banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--gum) 22%,var(--paper))}
.month-banner svg{width:56px;height:56px;flex:none}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 24%,var(--paper));color:var(--ink)}
.tag.no{background:transparent;border:1.5px dashed var(--c)}
.hint{font-size:13px;color:var(--warn);font-weight:600}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.list-row svg.char{width:28px;height:28px;flex:none}
.own-form{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:520px){.own-form{grid-template-columns:1fr 1fr}.own-form input{grid-column:1/-1}}
/* thanks stage */
.thx-stage{position:relative;height:260px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 78%,color-mix(in srgb,var(--sun) 42%,var(--paper)),color-mix(in srgb,var(--gum) 26%,var(--paper)) 70%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px}
.thx-stage .actor svg{width:130px;height:130px;display:block}
.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:18px;font-weight:600;width:max-content;max-width:86%;text-align:center;box-shadow:var(--shadow);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--paper);border-bottom:0}
.float{position:absolute;bottom:-26px;width:22px;height:22px;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
.float svg{width:100%;height:100%;display:block}
@keyframes rise{to{transform:translateY(-300px) rotate(var(--r));opacity:0}}
.a-dance{animation:dance .9s ease-in-out infinite;transform-origin:50% 90%}
@keyframes dance{0%,100%{transform:rotate(-14deg)}25%{transform:rotate(0) translateY(-16px)}50%{transform:rotate(14deg)}75%{transform:rotate(0) translateY(-16px)}}
.a-jump{animation:jump .75s cubic-bezier(.3,.6,.4,1) infinite;transform-origin:50% 100%}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.12,.88)}45%,55%{transform:translateY(-48px) scale(.94,1.06)}}

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayS = () => ymd(new Date());
const nowLocal = (d = new Date()) => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const dow = s => (parse(s).getDay() + 6) % 7; // 0 = lunes
const weekStart = s => addDays(s, -dow(s));
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DAYS_S = ["Lu","Ma","Mi","Ju","Vi","Sá","Do"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtDay = s => { const d = parse(s); return `${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const shortDay = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth()+1}`; };
function dayLabel(s){
  const t = todayS();
  if (s === t) return "Hoy";
  if (s === addDays(t,1)) return "Mañana";
  if (s === addDays(t,-1)) return "Ayer";
  return DAYS[dow(s)];
}
function shade(hex, amt){ // amt -1..1
  const n = parseInt(hex.slice(1), 16); let r = n>>16, g = (n>>8)&255, b = n&255;
  const f = v => Math.round(amt < 0 ? v*(1+amt) : v + (255-v)*amt);
  return "#" + [f(r),f(g),f(b)].map(v => v.toString(16).padStart(2,"0")).join("");
}

/* ============ characters (SVG) ============ */
const CHARS = ["flower","frog","heart","star","pig","cat","cloud","blob","pentagon","dog"];
const CHAR_NAMES = {flower:"Flor",frog:"Rana",heart:"Corazón",star:"Estrella",pig:"Chanchito",cat:"Gato",cloud:"Nube",blob:"Burbuja",pentagon:"Pentágono",dog:"Perrito"};
const FACES = ["happy","dots","wink","sleepy"];
const PALETTE = ["#EF8BB3","#7DB64A","#F0644B","#F6C445","#7F9BE0","#3BBDAE","#B58AE8","#F59A4A","#F7B7C3","#8FC7E8"];
let svgSeq = 0;

function faceSVG(kind, cx, cy, s = 1, cheeks = "#F6B6CE", noMouth = false){
  const ex = 11*s, ey = 0, er = 7.5*s;
  let eyes = "";
  if (kind === "happy"){
    eyes = [-1,1].map(k => `<circle cx="${cx+k*ex}" cy="${cy+ey}" r="${er}" fill="#fff"/><circle cx="${cx+k*ex+1.8*s}" cy="${cy+ey-2.2*s}" r="${er*.55}" fill="#2A2240"/>`).join("");
  } else if (kind === "dots"){
    eyes = [-1,1].map(k => `<circle cx="${cx+k*ex}" cy="${cy}" r="${3.6*s}" fill="#2A2240"/>`).join("");
  } else if (kind === "wink"){
    eyes = `<circle cx="${cx-ex}" cy="${cy}" r="${3.8*s}" fill="#2A2240"/><path d="M${cx+ex-4.5*s} ${cy-4*s} L${cx+ex+3*s} ${cy} L${cx+ex-4.5*s} ${cy+4*s}" fill="none" stroke="#2A2240" stroke-width="${2.6*s}" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (kind === "tired"){
    eyes = [-1,1].map(k => `<path d="M${cx+k*ex-5*s} ${cy} L${cx+k*ex+5*s} ${cy}" stroke="#2A2240" stroke-width="${2.6*s}" stroke-linecap="round"/><path d="M${cx+k*ex-3.4*s} ${cy+0.6*s} A${3.4*s} ${3.4*s} 0 0 0 ${cx+k*ex+3.4*s} ${cy+0.6*s}Z" fill="#2A2240"/><path d="M${cx+k*ex-4*s} ${cy+5.5*s} Q${cx+k*ex} ${cy+7.5*s} ${cx+k*ex+4*s} ${cy+5.5*s}" stroke="#9C8FC2" stroke-width="${1.6*s}" fill="none" stroke-linecap="round" opacity=".8"/>`).join("");
  } else if (kind === "party"){
    eyes = [-1,1].map(k => `<path d="M${cx+k*ex-5*s} ${cy+2*s} Q${cx+k*ex} ${cy-5*s} ${cx+k*ex+5*s} ${cy+2*s}" fill="none" stroke="#2A2240" stroke-width="${2.8*s}" stroke-linecap="round"/>`).join("");
  } else {
    eyes = [-1,1].map(k => `<path d="M${cx+k*ex-5*s} ${cy-1*s} Q${cx+k*ex} ${cy+4.5*s} ${cx+k*ex+5*s} ${cy-1*s}" fill="none" stroke="#2A2240" stroke-width="${2.6*s}" stroke-linecap="round"/>`).join("");
  }
  const my = cy + 9*s;
  let mouth = `<path d="M${cx-4.5*s} ${my} Q${cx} ${my+5*s} ${cx+4.5*s} ${my}" fill="none" stroke="#2A2240" stroke-width="${2.4*s}" stroke-linecap="round"/>`;
  if (kind === "tired") mouth = `<ellipse cx="${cx+1*s}" cy="${my+1.5*s}" rx="${3*s}" ry="${2.4*s}" fill="#2A2240"/><path d="M${cx+3.5*s} ${my+3*s} q${1.5*s} ${5*s} 0 ${8*s} q${-2.2*s} ${2*s} ${-3*s} 0 q0 ${-4*s} ${3*s} ${-8*s}z" fill="#8FD3F2"/>`;
  if (kind === "party") mouth = `<path d="M${cx-6*s} ${my-1*s} Q${cx} ${my+10*s} ${cx+6*s} ${my-1*s}Z" fill="#2A2240"/><path d="M${cx-3*s} ${my+3.5*s} Q${cx} ${my+1.5*s} ${cx+3*s} ${my+3.5*s} Q${cx} ${my+7*s} ${cx-3*s} ${my+3.5*s}Z" fill="#F08DB5"/>`;
  const ch = kind === "happy" ? "" : [-1,1].map(k => `<ellipse cx="${cx+k*18*s}" cy="${cy+7*s}" rx="${5.5*s}" ry="${3.8*s}" fill="${cheeks}" opacity=".85"/>`).join("");
  return ch + eyes + (noMouth ? "" : mouth);
}
function starPath(cx, cy, n, R, r){
  let d = ""; for (let i = 0; i < n*2; i++){ const a = Math.PI*i/n - Math.PI/2, rad = i%2 ? r : R; d += (i?"L":"M") + (cx+Math.cos(a)*rad).toFixed(1) + " " + (cy+Math.sin(a)*rad).toFixed(1); }
  return d + "Z";
}
function charSVG(p, cls = "char"){
  const c = p?.color || "#B58AE8", kind = p?.char || "blob", face = p?.face || "dots";
  const dk = shade(c, -0.22), lt = shade(c, 0.45);
  let body = "", f = faceSVG(face, 50, 52);
  switch (kind){
    case "flower":
      for (let i = 0; i < 6; i++){ const a = i*Math.PI/3; body += `<circle cx="${50+Math.cos(a)*27}" cy="${52+Math.sin(a)*27}" r="19" fill="${c}"/>`; }
      body += `<circle cx="50" cy="52" r="25" fill="#F6C445"/>`; f = faceSVG(face, 50, 49, .82, "#EEA24A"); break;
    case "frog":
      body = `<circle cx="29" cy="34" r="14" fill="${c}"/><circle cx="71" cy="34" r="14" fill="${c}"/><ellipse cx="50" cy="60" rx="40" ry="28" fill="${c}"/>`;
      f = (face==="happy" ? `<circle cx="29" cy="33" r="7.5" fill="#fff"/><circle cx="31" cy="31" r="4" fill="#2A2240"/><circle cx="71" cy="33" r="7.5" fill="#fff"/><circle cx="73" cy="31" r="4" fill="#2A2240"/>`
        : face==="wink" ? `<circle cx="29" cy="33" r="5" fill="#2A2240"/><path d="M66 29 L74 33 L66 37" fill="none" stroke="#2A2240" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`

let SB = null, HH = null;

/* Cada cambio se guarda primero en el celu (bandeja de salida) y después en la base.
   Si la base no responde, queda pendiente y se reintenta solo: nada se pierde al recargar. */
let outbox = {}, saving = 0;
const outboxKey = () => "nido-outbox-" + (HH?.id || "x");
function saveOutbox(){ try { localStorage.setItem(outboxKey(), JSON.stringify(outbox)); } catch {} }
function loadOutbox(){ try { outbox = JSON.parse(localStorage.getItem(outboxKey()) || "{}") || {}; } catch { outbox = {}; } }
async function send(col, id, op, data){
  const key = col + "/" + id, item = { col, id, op, data };
  outbox[key] = item; saveOutbox(); saving++; renderSync();
  try {
    const res = op === "put"
      ? await SB.from("docs").upsert({ household_id:HH.id, col, id, data, updated_at:new Date().toISOString() })
      : await SB.from("docs").delete().match({ household_id:HH.id, col, id });
    if (res.error) throw res.error;
    if (outbox[key] === item){ delete outbox[key]; saveOutbox(); }
    ui.saveErr = null;
  } catch (e){
    if (!ui.saveErr) handleWriteErr(e);
    ui.saveErr = e?.message || "sin conexión";
  }
  saving--; renderSync();
}
async function flushOutbox(){ const items = Object.values(outbox); for (const it of items) if (outbox[it.col + "/" + it.id] === it) await send(it.col, it.id, it.op, it.data); }

  const el = document.getElementById("sync"); if (!el) return;

  else el.innerHTML = "";

async function loadAll(){
  const next = {}; Object.keys(store).forEach(k => { next[k] = {}; });
  for (let from = 0; ; from += 1000){
    const { data, error } = await SB.from("docs").select("col,id,data").eq("household_id", HH.id).range(from, from + 999);
    if (error) throw error;
    data.forEach(r => { const cur = store[r.col]?.[r.id]; (next[r.col] ||= {})[r.id] = cur?._t && Date.now() - cur._t < 15000 && (r.data?._t || 0) < cur._t ? cur : { ...r.data, id:r.id }; });

function suggestions(){
  const out = [], t = todayS(), ws = weekStart(t), days = weekDays(ws).filter(d => d >= t);
  // 0) partner with low energy today: offer a hand
  const oth = other(me);
  if (me && moodOf(oth, t) === 1 && moodOf(me, t) >= 3){
    const x = tasksOn(t).find(y => y.status !== "done" && (y.assignees||[]).length === 1 && y.assignees[0] === oth);
    if (x) out.push({ who:me, text:`${prof(oth).name} hoy está sin pilas y vos venís bien. ¿Le das una mano con “${x.title}”?`, act:{ type:"assign", id:x.id, to:me }, label:"Me la quedo yo" });
  }
  // 1) days over capacity (office, can't, low energy, too many)
  for (const k of KEYS){
    for (const d of days){
      const n = loadOf(d, k), cap = capacity(k, d);
      if (n <= cap) continue;
      const cand = tasksOn(d).filter(x => x.status !== "done" && !x.time && (x.assignees||[]).length === 1 && x.assignees[0] === k).sort((a,b) => (a.points||1)-(b.points||1));
      const x = cand.find(c => ownerOf(c.title) !== k) || cand[0];
      if (!x) continue;
      const o = other(k), why = whyBusy(k, d) || `${prof(k).name} tiene ${n} tareas`;
      const dn = d === t ? "Hoy" : `El ${DAYS[dow(d)].toLowerCase()}`;
      if (ownerOf(x.title) !== k && !awayOn(o, d) && loadOf(d, o) < capacity(o, d)){
        out.push({ who:k, text:`${dn} ${why}. ¿Le pasamos “${x.title}” a ${prof(o).name}, que ese día tiene más lugar?`, act:{ type:"assign", id:x.id, to:o }, label:`Pasársela a ${prof(o).name}` });
        break;
      }
      const best = days.filter(dd => dd !== d).map(dd => [dd, capacity(k, dd) - loadOf(dd, k)]).filter(([, s]) => s > 0).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))[0];
      if (!best) continue;
      out.push({ who:k, text:`${dn} ${why}. Probá pasar “${x.title}” al ${DAYS[dow(best[0])].toLowerCase()}, que está más tranqui.`, act:{ type:"move", id:x.id, day:best[0] }, label:`Mover al ${DAYS[dow(best[0])].toLowerCase()}` });
      break;
    }
  }
  // 2) late tasks
  const late = tasks().filter(x => x.day && x.day < t && x.status !== "done");
  if (late.length) out.push({ who: (late[0].assignees||[])[0] || me, text:`${late.length === 1 ? "Quedó una tarea" : `Quedaron ${late.length} tareas`} sin hacer de días pasados. ¿${late.length === 1 ? "La pasamos" : "Las pasamos"} a hoy?`, act:{ type:"late-today" }, label:"Pasar a hoy" });
  // 3) balance over last 30 days
  const from = addDays(t, -29), a = pointsBy("pau", from, t), b = pointsBy("fede", from, t), tot = a + b;
  if (tot >= 6 && Math.abs(a - b) / tot >= .3){
    const low = a < b ? "pau" : "fede", high = other(low);
    const q = tasks().filter(x => !x.day && x.status !== "done").sort((x,y) => (y.points||1)-(x.points||1))[0];
    out.push({ who:high, text:`Este mes ${prof(high).name} sumó ${Math.max(a,b)}⭐ y ${prof(low).name} ${Math.min(a,b)}⭐. Para emparejar, la próxima tarea podría ir para ${prof(low).name}.` + (q ? ` ¿Le pasamos “${q.title}”?` : ""),
      act: q ? { type:"assign", id:q.id, to:low } : null, label: q ? `Asignar a ${prof(low).name}` : "" });
  }
  // 4) queue
  const queue = tasks().filter(x => !x.day && x.status !== "done");
  if (queue.length >= 5) out.push({ who:me, text:`Hay ${queue.length} tareas esperando en la cola. ¿Agendamos alguna para esta semana?`, act:{ type:"go", tab:"semana" }, label:"Ver la semana" });
  return out.slice(0, 4);
}

function nextReminder(){
  const now = new Date(), nowDow = (now.getDay()+6)%7, nowMin = now.getHours()*60 + now.getMinutes();
  let best = null;
  for (const r of Object.values(store.reminders)){
    if (!r.active || !(r.who||[]).includes(me)) continue;
    const [h, m] = (r.time||"00:00").split(":").map(Number);
    for (let off = 0; off < 8; off++){
      const d = (nowDow + off) % 7;
      if (!(r.days||[]).includes(d)) continue;
      if (off === 0 && h*60+m < nowMin) continue;
      const score = off*1440 + h*60 + m;
      if (!best || score < best.score) best = { r, off, score };
      break;
    }
  }
  return best;
}

  if (t.kind === "gestion") meta.push(`<span class="pill gest">Gestión</span>`);
  if (t.spontaneous) meta.push(`<span class="pill">Sin anotar</span>`);

  if (t.status === "done" && t.doneBy?.length) meta.push(`<span>Hecha por ${t.doneBy.map(k => esc(prof(k).name)).join(" y ")}</span>`);
  if (late) meta.push(`<span class="pill late">Atrasada</span>`);
  let thx = "";
  if (t.status === "done" && me){
    const th = t.thanks || {}, by = t.doneBy || [];
    const from = KEYS.find(k => k !== me && th[k] && by.includes(me));

    <span class="who">${who.length ? who.map(k => charSVG(prof(k))).join("") : charSVG({char:"blob",color:"#D9D2E6",face:"sleepy"})}</span>
    <button class="body" data-act="edit-task" data-v="${t.id}"><span class="t">${esc(t.title)}</span><span class="m">${meta.join("")}</span></button>
    ${thx}
    <button class="check" data-act="toggle" data-v="${t.id}" aria-label="${t.status==="done"?"Desmarcar":"Marcar como hecha"}">${ic("check", 3)}</button>
  </div>`;
}

  const freq = Object.values(store.shopping).filter(i => i.archived).sort((a,b) => (b.times||0)-(a.times||0)).slice(0, 12);
  const row = i => `<div class="item ${i.got?"got":""}">

/* ============ sheets ============ */
function openSheet(html, onMount){
  $("#layer").innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $("#layer").querySelector("input,button:not([data-act=close-sheet])"); first?.focus({ preventScroll:true });
  onMount?.($("#layer .sheet"));
}
const closeSheet = () => { $("#layer").innerHTML = ""; ui.daySheet = null; };

function dayChoices(sel){
  const t = todayS(), base = weekStart(t), opts = [];
  for (let i = 0; i < 14; i++){ const d = addDays(base, i); if (d >= t || d === sel) opts.push(d); }
  if (sel && !opts.includes(sel)) opts.unshift(sel);
  return `<button type="button" class="chip" data-pick="day" data-v="" aria-pressed="${!sel}">En la cola</button>` +
    opts.map(d => `<button type="button" class="chip" data-pick="day" data-v="${d}" aria-pressed="${sel===d}">${d===t?"Hoy":d===addDays(t,1)?"Mañana":DAYS_S[dow(d)]+" "+shortDay(d)}</button>`).join("");
}

const tplChips = kind => {
  const base = kind === "gestion" ? TEMPLATES_G : TEMPLATES, cnt = {}, pts = {};
  tasks().filter(t => (t.kind || "hogar") === kind && !t.routine && !t.via && !t.title.startsWith("Compra del súper")).forEach(t => { cnt[t.title] = (cnt[t.title] || 0) + 1; pts[t.title] = t.points || 1; });
  const fav = Object.entries(cnt).sort((a,b) => b[1] - a[1]).slice(0, 6).map(([n]) => [n, pts[n]]), seen = new Set(fav.map(f => norm(f[0])));
  return [...fav, ...base.filter(([n]) => !seen.has(norm(n)))].map(([n,p]) => `<button type="button" class="chip" data-tpl="${esc(n)}" data-p="${p}">${esc(n)}</button>`).join("");
};
const BIG_RE = /veterin|medic|turno|dentist|compra grande|compras del mes|regalo|visita|arreglo|plomer|electricist|vacuna|cumple|viaje|mudanza|service|banco/;
function syncPressed(sheet, group, fn){ sheet.querySelectorAll(`[data-pick=${group}]`).forEach(x => x.setAttribute("aria-pressed", fn(x.dataset.v))); }
function whoPressed(as){ return v => v === "both" ? as.length === 2 : v === "none" ? as.length === 0 : as.length === 1 && as[0] === v; }

function taskSheet(id, presetDay){
  const t = id ? store.tasks[id] : { title:"", assignees:[me], day: presetDay ?? todayS(), time:"", points:1, repeat:"none", kind:"hogar" };
  const draft = { assignees:[...(t.assignees||[])], day:t.day || "", points:t.points||1, kind:t.kind||"hogar", owner: id ? ownerOf(t.title) : null, cal: !!t.cal };
  let calTouched = !!id;
  const tmd = todayS();
  openSheet(`<form data-form="task" style="display:contents">
    <h2>${id ? "Editar tarea" : "Nueva tarea"}</h2>
    ${id && t.status !== "done" ? `<div class="field"><span class="lbl">Mover rápido</span><div class="wrap-row">
      <button type="button" class="btn sm" data-quick="${tmd}">Hoy</button><button type="button" class="btn sm" data-quick="${addDays(tmd,1)}">Mañana</button>
      ${t.day ? `<button type="button" class="btn sm" data-quick="${addDays(t.day < tmd ? tmd : t.day, 1)}">Un día después</button><button type="button" class="btn sm" data-quick="${addDays(t.day,7)}">Una semana después</button>` : ""}
      <button type="button" class="btn sm" data-quick="">A la cola</button></div></div>` : ""}
    <div class="field"><span class="lbl">Tipo</span><div class="wrap-row">${Object.entries(KINDS).map(([k,v]) => `<button type="button" class="chip" data-pick="kind" data-v="${k}" aria-pressed="${draft.kind===k}">${v}</button>`).join("")}</div>
      <span class="small muted" id="kindHint">${KIND_HINT[draft.kind]}</span></div>
    ${!id ? `<div class="field"><label for="tPick">Elegí una frecuente…</label>${catalogSelect("tPick")}</div>` : ""}
    <div class="field"><label for="tTitle">${id ? "¿Qué hay que hacer?" : "…o escribila"}</label><input class="inp" id="tTitle" required maxlength="80" value="${esc(t.title)}" placeholder="${draft.kind==="gestion"?"Pedir turno al veterinario":"Lavar las sábanas"}">
      ${!id ? `
      <div class="wrap-row" style="align-items:center"><span class="small muted">O en pasos:</span>${BATCHES.map((b, i) => `<button type="button" class="chip" data-batch="${i}">${esc(b[0])} · ${b[1].length} pasos</button>`).join("")}<button type="button" class="chip" data-batch="new">+ Armar tanda</button></div>` : ""}</div>
    <div class="field"><span class="lbl">¿Quién la hace?</span><div class="wrap-row">
      ${KEYS.map(k => `<button type="button" class="chip" data-pick="who" data-v="${k}" aria-pressed="${whoPressed(draft.assignees)(k)}">${charSVG(prof(k))}${esc(prof(k).name)}</button>`).join("")}
      <button type="button" class="chip" data-pick="who" data-v="both" aria-pressed="${draft.assignees.length===2}">Los dos</button>
      <button type="button" class="chip" data-pick="who" data-v="none" aria-pressed="${draft.assignees.length===0}">Después vemos</button></div></div>
    <div class="field"><span class="lbl">¿Cuándo?</span><div class="wrap-row">${dayChoices(draft.day)}</div><span class="hint" id="dayHint"></span></div>
    <div class="field"><label for="tTime">Horario (opcional)</label><input class="inp" type="time" id="tTime" value="${esc(t.time||"")}" style="max-width:160px"></div>
    <div class="field"><span class="lbl">¿Cuánto esfuerzo?</span><div class="wrap-row">
      ${effortChips(draft.points)}</div></div>
    <div class="field"><label for="tRepeat">Repetir</label><select class="inp" id="tRepeat">${Object.entries(REPEATS).map(([k,v]) => `<option value="${k}" ${(t.repeat||"none")===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="field"><div class="row"><button type="button" class="switch" role="switch" id="tCal" aria-checked="${draft.cal}" aria-label="Mostrar en Google Calendar"></button><span><b>En Google Calendar</b></span></div></div>
    <div class="field"><span class="lbl">Dueño de esta tarea</span><div class="wrap-row">
      <button type="button" class="chip" data-pick="owner" data-v="" aria-pressed="${!draft.owner}">Nadie fijo</button>
      ${KEYS.map(k => `<button type="button" class="chip" data-pick="owner" data-v="${k}" aria-pressed="${draft.owner===k}">${CROWN}${esc(prof(k).name)}</button>`).join("")}</div></div>
    ${id && t.status === "done" ? `<div class="field"><span class="lbl">La hizo</span><div class="wrap-row">${KEYS.map(k => `<button type="button" class="chip" data-pick="doneby" data-v="${k}" aria-pressed="${(t.doneBy||[]).length===1&&t.doneBy[0]===k}">${esc(prof(k).name)}</button>`).join("")}<button type="button" class="chip" data-pick="doneby" data-v="both" aria-pressed="${(t.doneBy||[]).length===2}">Los dos</button></div></div>` : ""}
    <div class="sheet-foot">
      ${id ? `<button type="button" class="btn danger" data-del="${id}">Borrar</button>` : ""}
      ${id && t.day ? `<a class="btn ghost" href="${gcalTaskUrl(t)}" target="_blank" rel="noopener">${ic("cal")}A Google Calendar</a>` : ""}
      <span class="sp"></span>
      <button type="button" class="btn ghost" data-act="close-sheet-btn">Cancelar</button>
      <button type="submit" class="btn pri">${id ? "Guardar" : "Anotar"}</button>
    </div></form>`, sheet => {
    let doneBy = t.doneBy ? [...t.doneBy] : null;
    const hints = () => {
      const d = draft.day, h = sheet.querySelector("#dayHint");
      if (!d){ h.textContent = ""; return; }
      const msgs = draft.assignees.map(k => { const w = whyBusy(k, d); if (w) return w; const n = loadOf(d, k) + (id && store.tasks[id]?.day === d ? -1 : 0); return n >= capacity(k, d) ? `${prof(k).name} ya tiene ${n} tareas ese día` : ""; }).filter(Boolean);
      h.textContent = msgs.length ? msgs.join(" · ") + ". ¿Probás otro día?" : "";
    };
    const applyOwner = () => {
      const o = ownerOf($("#tTitle").value);
      if (!o || id) return;
      draft.owner = o; draft.assignees = [o];
      syncPressed(sheet, "owner", v => v === o); syncPressed(sheet, "who", whoPressed(draft.assignees)); hints();
    };
    const autoCal = () => { if (calTouched) return; draft.cal = BIG_RE.test(norm($("#tTitle").value)); sheet.querySelector("#tCal").setAttribute("aria-checked", draft.cal); };
    hints();
    $("#tTitle").addEventListener("change", () => { applyOwner(); autoCal(); });
    sheet.querySelector("#tPick")?.addEventListener("change", e => {
      const c = store.catalog[e.target.value]; if (!c) return;
      $("#tTitle").value = c.title; draft.points = c.points || 2; draft.kind = c.kind || "hogar";
      syncPressed(sheet, "pts", v => +v === draft.points); syncPressed(sheet, "kind", v => v === draft.kind); sheet.querySelector("#kindHint").textContent = KIND_HINT[draft.kind];
      if (!calTouched){ draft.cal = !!c.cal || BIG_RE.test(norm(c.title)); sheet.querySelector("#tCal").setAttribute("aria-checked", draft.cal); }
      applyOwner();
    });
    sheet.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.batch != null){ const pd = draft.day; closeSheet(); batchSheet(b.dataset.batch === "new" ? null : BATCHES[+b.dataset.batch], pd); return; }
      if (b.id === "tCal"){ calTouched = true; draft.cal = !draft.cal; b.setAttribute("aria-checked", draft.cal); return; }
      if (b.dataset.tpl){ $("#tTitle").value = b.dataset.tpl; draft.points = +b.dataset.p; syncPressed(sheet, "pts", v => +v === draft.points); applyOwner(); autoCal(); return; }
      if (b.dataset.pick){
        const g = b.dataset.pick, v = b.dataset.v;
        sheet.querySelectorAll(`[data-pick=${g}]`).forEach(x => x.setAttribute("aria-pressed", x === b));
        if (g === "who") draft.assignees = v === "both" ? [...KEYS] : v === "none" ? [] : [v];
        if (g === "day") draft.day = v;
        if (g === "pts") draft.points = +v;
        if (g === "doneby") doneBy = v === "both" ? [...KEYS] : [v];
        if (g === "kind"){ draft.kind = v; sheet.querySelector("#kindHint").textContent = KIND_HINT[v]; const row = sheet.querySelector("#tplRow"); if (row) row.innerHTML = tplChips(v); }
        if (g === "owner"){ draft.owner = v || null; if (v && !id){ draft.assignees = [v]; syncPressed(sheet, "who", whoPressed(draft.assignees)); } }
        hints();
        return;
      }
      if ("quick" in b.dataset){ patch("tasks", id, { day: b.dataset.quick || null }); closeSheet(); toast(b.dataset.quick ? `Movida a ${dayLabel(b.dataset.quick).toLowerCase()}` : "Pasó a la cola"); return; }
      if (b.dataset.del){ del("tasks", b.dataset.del); closeSheet(); toast("Tarea borrada"); return; }
      if (b.dataset.act === "close-sheet-btn") closeSheet();
    });
    sheet.querySelector("form").addEventListener("submit", e => {
      e.preventDefault();
      const title = $("#tTitle").value.trim(); if (!title) return;
      const base = id ? store.tasks[id] : { status:"todo", createdAt:nowLocal(), createdBy:me };
      const data = { ...base, title, kind:draft.kind, assignees:draft.assignees, day:draft.day || null, time:$("#tTime").value || null, points:draft.points, repeat:$("#tRepeat").value, cal:draft.cal };
      if (id && t.status === "done" && doneBy) data.doneBy = doneBy;
      if ((draft.owner || null) !== ownerOf(title)){
        const ow = draft.owner;
        updateHome(h => { const o = { ...(h.owners || {}) }; if (ow) o[okey(title)] = { title, who:ow }; else delete o[okey(title)]; return { ...h, owners:o }; });
      }
      put("tasks", id || uid8(), data);
      if (!id && !store.catalog[ckey(title)]) put("catalog", ckey(title), { title, kind:data.kind, points:data.points, cal:!!data.cal });
      closeSheet();
      toast(id ? "Cambios guardados" : data.day ? `Anotada para ${dayLabel(data.day).toLowerCase()}` : "Anotada en la cola");
    });
  });
}

function profSheet(){
  const P = { ...prof(me) };
  const draw = sheet => {
    sheet.querySelector("#prevChar").innerHTML = charSVG(P, "char wiggle");
    sheet.querySelectorAll("[data-ch]").forEach(b => { b.setAttribute("aria-pressed", b.dataset.ch === P.char); b.innerHTML = charSVG({ ...P, char:b.dataset.ch }); });

function moodSVG(p, lv){
  let s = charSVG({ ...p, face: MOOD_FACE[lv] || "dots" });
  const z = `<text x="76" y="24" font-family="Fredoka, sans-serif" font-weight="700" font-size="17" fill="#7F9BE0">z</text><text x="88" y="12" font-family="Fredoka, sans-serif" font-weight="700" font-size="12" fill="#7F9BE0">z</text>`;
  const hat = `<g transform="rotate(-16 50 14)"><path d="M41 22 L50 -1 L59 22Z" fill="#F0644B"/><path d="M44.3 13.5 L55.7 13.5" stroke="#F6C445" stroke-width="2.6"/><circle cx="50" cy="0" r="3.4" fill="#F6C445"/></g>`;
  const conf = [["#F6C445",8,30,15],["#3BBDAE",90,24,-20],["#EF8BB3",94,62,30],["#7F9BE0",4,66,-35],["#F0644B",84,8,10]].map(([c,x,y,r]) => `<rect x="${x}" y="${y}" width="6" height="3" rx="1" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`).join("");

}

/* ============ resumen mensual ============ */
function monthStats(m){
  const [Y, M] = m.split("-").map(Number), first = `${m}-01`, last = ymd(new Date(Y, M, 0));
  const inM = s => s && s.slice(0,10) >= first && s.slice(0,10) <= last;
  const done = tasks().filter(t => t.status === "done" && inM(t.doneAt));
  const per = {};
  for (const k of KEYS){
    const ds = done.filter(t => (t.doneBy||[]).includes(k));
    const cnt = {}; ds.forEach(t => { cnt[t.title] = (cnt[t.title]||0) + 1; });
    const moods = Object.values(store.mood).filter(x => x.who === k && x.date >= first && x.date <= last);
    per[k] = { n:ds.length, pts:ds.reduce((s,t) => s + (t.points||1), 0), hogar:ds.filter(t => t.kind !== "gestion").length, gest:ds.filter(t => t.kind === "gestion").length,
      spont:ds.filter(t => t.spontaneous).length, thxIn:ds.reduce((s,t) => s + Object.keys(t.thanks||{}).filter(f => f !== k).length, 0),
      thxOut:tasks().filter(t => t.thanks?.[k] && inM(t.thanks[k].at)).length,
      top:Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,3), moodAvg: moods.length ? moods.reduce((s,x) => s + x.level, 0) / moods.length : 0, moodDays:moods.length,
      habitPts: habitScore(first, last)[k], habitN: Object.values(store.habitlog).filter(l => l.date >= first && l.date <= last && whoList(l.who).includes(k) && store.habits[l.habit]?.kind !== "treat").length,
      treats: Object.values(store.habitlog).filter(l => l.date >= first && l.date <= last && whoList(l.who).includes(k) && store.habits[l.habit]?.kind === "treat").length,
      apps: ds.filter(t => t.via === "app").length };
  }
  const byDow = Array(7).fill(0); done.forEach(t => byDow[dow(t.doneAt.slice(0,10))]++);
  const quotes = [];
  tasks().forEach(t => Object.entries(t.thanks||{}).forEach(([from, th]) => { if (inM(th.at) && th.msg) quotes.push({ from, to:(t.doneBy||[]).filter(k => k !== from), msg:th.msg, at:th.at, title:t.title }); }));
  quotes.sort((a,b) => b.at.localeCompare(a.at));
  return { first, last, Y, M, done, per, byDow, quotes, together:done.filter(t => (t.doneBy||[]).length > 1).length };
}
function viewSummary(){
  const m = ui.month, S = monthStats(m), P = S.per, tot = P.pau.pts + P.fede.pts, pa = tot ? Math.round(P.pau.pts / tot * 100) : 50;

  const maxKind = Math.max(1, ...KEYS.map(k => P[k].hogar + P[k].gest));
  const busiest = S.done.length ? S.byDow.indexOf(Math.max(...S.byDow)) : -1;
  const lead = dow(S.first);

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function b64ToBytes(s){ const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error("sw")), 6000))]);
async function saveSub(sub){ if (!SB || !HH || !me) return; await SB.from("push_subs").upsert({ endpoint:sub.endpoint, household_id:HH.id, user_id:MY_UID, profile_key:me, sub:sub.toJSON() }); }
async function detectPush(){
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){ ui.pushState = isIOS && !isStandalone() ? "ios-install" : "unsupported"; render(); return; }
  try { const reg = await swReady(), sub = await reg.pushManager.getSubscription();
    ui.pushState = sub && Notification.permission === "granted" ? "on" : "off";
    if (sub && ui.pushState === "on") saveSub(sub);
  } catch { ui.pushState = "off"; }
  render();
}
async function enablePush(){
  const key = (window.NIDO_CONFIG || {}).vapidPublicKey;
  if (!key){ toast("Falta configurar las notificaciones en el servidor."); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ toast("Sin permiso no te puedo avisar. Podés activarlo en la configuración del navegador."); return; }
    const reg = await swReady();
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(key) });
    await saveSub(sub); ui.pushState = "on"; render(); toast("¡Listo! Te van a llegar los avisos en este dispositivo.");
  } catch { toast("No se pudieron activar las notificaciones en este dispositivo."); }
}
function pushCard(){

  if (st === "on") return `<div class="next-rem">${dog}<div><b>Notificaciones activadas en este dispositivo.</b><div class="small muted">Te llegan aunque Nido esté cerrado.</div></div></div>`;

function seeded(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function buildLetter(m, seed){
  const S = monthStats(m), P = S.per, rnd = seeded(seed), pick = a => a[Math.floor(rnd() * a.length)];
  const N = k => prof(k).name, mes = monthLabel(m), pet = homeCtx().pet || "Vita";
  const cats = FAMILY.filter(f => f.role.startsWith("Gata")).map(famName);
  const catList = cats.length > 1 ? cats.slice(0, -1).join(", ") + " y " + cats[cats.length - 1] : cats.join("");
  const out = [];
  out.push(pick([`Querida familia del nido:`, `Hola, ${N("pau")} y ${N("fede")}:`, `Para ${N("pau")} y ${N("fede")}, con cariño:`]));
  out.push(pick([`${mes.charAt(0).toUpperCase() + mes.slice(1)} cerró con ${S.done.length} tareas hechas`, `En ${mes} hicieron ${S.done.length} tareas`, `Este ${mes} el nido sumó ${S.done.length} tareas hechas`]) + (S.together ? `, ${S.together} de ellas entre los dos.` : "."));
  for (const k of KEYS){
    const p = P[k], top = p.top[0];
    if (!p.n){ out.push(`${N(k)} tuvo un mes tranqui en tareas. Pasa, y para eso están los dos.`); continue; }
    let s = `${N(k)} sumó ${p.pts} estrellitas` + (top ? pick([` y se lució con “${top[0]}”`, `, con “${top[0]}” como especialidad`, ` y fue fan de “${top[0]}”`]) + (top[1] > 1 ? ` (${top[1]} veces)` : "") : "") + ".";
    if (p.gest) s += ` Además se ocupó de ${p.gest} ${p.gest === 1 ? "cosa" : "cosas"} de gestión, de esas que no se ven pero sostienen todo.`;
    if (p.spont) s += ` Y ${p.spont === 1 ? "hizo una" : `hizo ${p.spont}`} sin que nadie lo anotara.`;
    out.push(s);
  }
  const hab = P.pau.habitN + P.fede.habitN;
  if (hab) out.push(pick([`En hábitos de a dos se anotaron ${hab} cosas que les hacen bien.`, `Se cuidaron: ${hab} hábitos saludables en el mes.`]) + (P.pau.apps + P.fede.apps ? ` Y ${P.pau.apps + P.fede.apps} ${P.pau.apps + P.fede.apps === 1 ? "compra" : "compras"} del súper sin moverse del sillón.` : ""));
  if (S.quotes.length) out.push(`Hubo ${S.quotes.length} ${S.quotes.length === 1 ? "gracias" : "gracias"} este mes. ${pick(["La más linda", "Una para guardar", "Nos quedamos con esta"])}: “${S.quotes[Math.floor(rnd() * S.quotes.length)].msg}”.`);
  const a = P.pau.pts, b = P.fede.pts, tot = a + b;
  if (tot && Math.abs(a - b) / tot >= .3){ const low = a < b ? "pau" : "fede"; out.push(`${N(other(low))} hizo un poco más de la mitad este mes. Para ${pick(["el que viene", "diciembre", "emparejar"]).replace("diciembre", "el mes que viene")}, ${N(low)} podría quedarse con alguna de sus tareas.`); }
  else if (tot) out.push(pick(["Estuvieron parejos. Así da gusto.", "Repartieron bastante parejo. Equipazo.", "El equilibrio estuvo lindo este mes."]));
  out.push(pick([`Firmado: el nido. Con un lengüetazo de ${pet} y un ronroneo de ${catList}.`, `${pet}, ${catList} también les agradecen (sobre todo por la comida).`, `Con cariño, el nido. ${pet} manda saludos y ${catList} fingen que no les importa.`]));
  return out.join("\n\n");
}

const HABIT_TPL = [["Cocinamos en casa","good","together",0,1],["Ir al gym","good","solo",3,2],["Salir a caminar","good","together",2,2],["Ir al cine","good","together",1,2],["Cocinar algo rico juntos","good","together",1,2],["Dormir 8 horas","good","solo",4,1],["Cena sin celulares","good","together",2,1],["Meditar","good","solo",3,1]];
const TREAT_TPL = [["Delivery o cheat meal","treat","together",2],["Postre de noche","treat","solo",2]];
const habits = () => Object.values(store.habits).sort((a,b) => (a.kind === "treat") - (b.kind === "treat") || (a.createdAt||"").localeCompare(b.createdAt||""));
const logKey = (hid, date, w) => `${hid}_${date}_${w}`;
const whoList = w => w === "both" ? [...KEYS] : [w];
function treatIndex(h, log){ // position of this log within its week (0-based)
  return Object.values(store.habitlog).filter(l => l.habit === h.id && l.who === log.who && weekStart(l.date) === weekStart(log.date) && l.date <= log.date).length - 1;
}
function homeMeals(h, date){ const ws = weekStart(date); return Object.values(store.habitlog).filter(x => x.habit === h.vs && weekStart(x.date) === ws).length; }
function habitPts(h, l){
  if (h.kind !== "treat") return h.points || 1;
  if (h.vs) return treatIndex(h, l) < Math.floor(homeMeals(h, l.date) / 4) ? 0 : -1;
  return treatIndex(h, l) < (h.budget ?? 2) ? 1 : -1;
}
function hcount(h, w, cnt, lim, days){
  if (h.kind === "treat" && h.vs){
    const c = Object.values(store.habitlog).filter(l => l.habit === h.vs && days.includes(l.date)).length, tot = c + cnt, pct = tot ? Math.round(c / tot * 100) : 100;
    return `<span class="hcnt tnum ${cnt > Math.floor(c/4) ? "over" : "met"}" title="${c} en casa, ${cnt} delivery">${pct}% casa</span>`;
  }
  return `<span class="hcnt tnum ${h.kind === "treat" && cnt > lim ? "over" : ""} ${h.kind !== "treat" && lim && cnt >= lim ? "met" : ""}">${cnt}${lim ? `/${lim}` : ""}</span>`;
}
function habitScore(from, to){
  const res = { pau:0, fede:0 };
  for (const l of Object.values(store.habitlog)){
    if (l.date < from || l.date > to) continue;
    const h = store.habits[l.habit]; if (!h) continue;
    const p = habitPts(h, l); whoList(l.who).forEach(k => { res[k] += p; });
  }
  return res;
}
function toggleHabit(hid, w, d){
  const h = store.habits[hid]; if (!h) return;
  w = h.mode === "together" ? "both" : w;
  const id = logKey(hid, d, w);
  if (store.habitlog[id]){ del("habitlog", id); return; }
  const l = { habit:hid, date:d, who:w, by:me, at:nowLocal() };
  put("habitlog", id, l);
  const p = habitPts(h, l), names = whoList(w).map(k => prof(k).name).join(" y ");
  if (h.kind === "treat" && h.vs) toast(p === 0 ? "Dentro del 80/20: neutro. Cocinar en casa suma estrellitas." : `Se pasaron del 20% de delivery esta semana: −1 ⭐. Cocinar en casa empareja.`);
  else if (h.kind === "treat") toast(p > 0 ? `Gustito sin culpa (${treatIndex(h, l)+1} de ${h.budget ?? 2} esta semana). +1 ⭐` : `Se pasaron del límite de la semana: −1 ⭐`);
  else { toast(`+${p} ⭐ para ${names} · ${h.name}`); }
}

const needItems = () => Object.values(store.shopping).filter(i => !i.archived && !i.got).sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
const shopMeta = () => store.shopmeta?.current || null;
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
function agoText(iso){
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins < 2 ? "recién" : `hace ${mins} min`;
  const h = Math.round(mins / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); return d === 1 ? "ayer" : `hace ${d} días`;
}
function getSnooze(){ try { return JSON.parse(localStorage.getItem("nido-shop-snooze") || "{}"); } catch { return {}; } }
function setSnooze(k, until){ const s = getSnooze(); s[k] = until; try { localStorage.setItem("nido-shop-snooze", JSON.stringify(s)); } catch {} }
function shopSuggestions(){
  const hist = {};
  tasks().filter(t => Array.isArray(t.items) && t.doneAt).forEach(t => t.items.forEach(n => { const k = norm(n); (hist[k] ||= { name:n, dates:[] }).dates.push(t.doneAt.slice(0,10)); }));
  const onList = new Set(Object.values(store.shopping).filter(i => !i.archived).map(i => norm(i.name)));
  const today = todayS(), snooze = getSnooze(), out = [];
  for (const [k, h] of Object.entries(hist)){
    if (onList.has(k) || (snooze[k] && snooze[k] > today)) continue;
    const ds = [...new Set(h.dates)].sort(); if (ds.length < 2) continue;
    const gaps = ds.slice(1).map((d, i) => daysBetween(ds[i], d)), avg = gaps.reduce((a,b) => a + b, 0) / gaps.length;
    if (avg < 2) continue;
    const since = daysBetween(ds[ds.length - 1], today);
    if (since < avg * 0.85) continue;
    out.push({ k, name:h.name, avg:Math.round(avg), since, score:since / avg });
  }
  return out.sort((a,b) => b.score - a.score).slice(0, 8);
}
function shopTopHTML(need){
  const m = shopMeta(), sug = shopSuggestions();
  let html = "";
  if (m){
    const added = need.filter(i => (i.createdAt || "") > m.closedAt).length;
    const buyer = m.buyer === "app" ? "se pide por app" : m.buyer === me ? "comprás vos" : `compra ${esc(prof(m.buyer).name)}`;

  cat: [["Vacuna anual",365,2],["Pipeta",30,1],["Desparasitario",90,1],["Cortar uñas",21,1],["Control veterinario",365,2]],
};
const EVERY = [[7,"semana"],[14,"2 semanas"],[21,"3 semanas"],[30,"mes"],[60,"2 meses"],[90,"3 meses"],[180,"6 meses"],[365,"año"]];
const everyText = n => (EVERY.find(e => e[0] === +n) || [0, `${n} días`])[1];
function careStatus(c){
  const n = careNext(c);
  if (!n) return { cls:"", txt:"Falta la última fecha", days:null };
  const d = daysBetween(todayS(), n);
  if (d < 0) return { cls:"late", txt:`Venció hace ${-d} ${-d === 1 ? "día" : "días"}`, days:d };
  if (d === 0) return { cls:"today", txt:"Toca hoy", days:0 };
  if (d === 1) return { cls:"soon", txt:"Mañana", days:1 };
  return { cls: d <= 7 ? "soon" : "", txt:`En ${d} días · ${shortDay(n)}`, days:d };
}
function ageText(birth){
  const b = parse(birth), t = parse(todayS());
  let m = (t.getFullYear() - b.getFullYear()) * 12 + t.getMonth() - b.getMonth(); if (t.getDate() < b.getDate()) m--;
  if (m < 0) return "";
  const y = Math.floor(m / 12), r = m % 12;
  if (!y) return `${r} ${r === 1 ? "mes" : "meses"}`;
  return `${y} ${y === 1 ? "año" : "años"}${r ? ` y ${r} ${r === 1 ? "mes" : "meses"}` : ""}`;
}

function weightCard(ws){

function petAlerts(){
  const out = [];
  for (const k of PET_KEYS){
    careOf(k).forEach(c => { const st = careStatus(c); if (st.days != null && st.days <= 3) out.push({ k, txt:`${c.label}: ${st.txt.toLowerCase()}`, urgent: st.days <= 0 }); });
  }
  Object.values(store.petsupply || {}).forEach(s => { const l = supplyLeft(s); if (l != null && l <= 5) out.push({ k:(s.pets || [])[0], txt:`${s.name}: ${l <= 0 ? "se terminó" : `quedan ~${l} días`}`, urgent: l <= 2 }); });

}

function checkSupplies(){

const BATCHES = [
  ["Lavar ropa", [["Poner un lavarropas",2],["Colgar la ropa",2],["Doblar y guardar la ropa",3]]],
  ["Sábanas", [["Sacar las sábanas",1],["Lavar las sábanas",2],["Colgar las sábanas",2],["Hacer la cama",2]]],
  ["Compras grandes", [["Armar la lista del súper",1,"gestion"],["Hacer las compras",3],["Guardar las compras",2]]],

function batchSheet(preset, presetDay){
  const steps = (preset ? preset[1] : [["",2],["",2]]).map(([title, points, kind]) => ({ title, points, kind:kind || "hogar", who:[me] }));
  let day = presetDay ?? todayS();
  const whoBtns = (st, i) => [...KEYS.map(k => [k, prof(k).name]), ["both","Los dos"]].map(([v, l]) => {
    const on = v === "both" ? st.who.length === 2 : st.who.length === 1 && st.who[0] === v;
    return `<button type="button" class="chip" style="padding:4px 9px;font-size:12.5px" data-sw="${i}" data-v="${v}" aria-pressed="${on}">${esc(l)}</button>`; }).join("");
  const stepsHTML = () => steps.map((st, i) => `<div class="card" style="display:flex;flex-direction:column;gap:8px;padding:12px">
      <div class="row"><span class="pill tnum">${i + 1}</span><input class="inp" data-st="${i}" maxlength="60" value="${esc(st.title)}" placeholder="Paso ${i + 1}" style="padding:9px 12px">${steps.length > 2 ? `<button type="button" class="x" data-rm="${i}" aria-label="Quitar paso">${ic("x",2.4)}</button>` : ""}</div>
      <div class="wrap-row">${whoBtns(st, i)}<select class="inp" data-sp="${i}" style="width:auto;padding:5px 8px;font-size:13px" aria-label="Esfuerzo">${EFFORT_OPTS.map(([v, l]) => `<option value="${v}" ${st.points === v ? "selected" : ""}>${starStr(v)} ${l}</option>`).join("")}</select></div></div>`).join("");
  openSheet(`<form style="display:contents"><h2>${preset ? `Tanda: ${esc(preset[0])}` : "Armar una tanda"}</h2>
    <div class="field"><label for="bName">Nombre de la tanda</label><input class="inp" id="bName" maxlength="40" required value="${esc(preset ? preset[0] : "")}" placeholder="Lavar ropa"></div>
    <div class="field"><span class="lbl">Pasos</span><div id="bSteps" style="display:flex;flex-direction:column;gap:8px">${stepsHTML()}</div>
      <button type="button" class="add-day" data-add="1">+ Agregar paso</button></div>
    <div class="field"><span class="lbl">¿Cuándo?</span><div class="wrap-row">${dayChoices(day)}</div></div>
    <div class="sheet-foot"><span class="sp"></span><button type="button" class="btn ghost" data-close="1">Cancelar</button><button class="btn pri" type="submit">Crear tanda</button></div></form>`, sheet => {
    const redraw = () => { sheet.querySelector("#bSteps").innerHTML = stepsHTML(); };
    sheet.addEventListener("input", e => { const i = e.target.dataset.st; if (i != null) steps[+i].title = e.target.value; });
    sheet.addEventListener("change", e => { const i = e.target.dataset.sp; if (i != null) steps[+i].points = +e.target.value; });
    sheet.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.sw != null){ const st = steps[+b.dataset.sw], v = b.dataset.v; st.who = v === "both" ? [...KEYS] : [v]; redraw(); }
      if (b.dataset.rm != null){ steps.splice(+b.dataset.rm, 1); redraw(); }
      if (b.dataset.add){ steps.push({ title:"", points:2, kind:"hogar", who:[me] }); redraw(); sheet.querySelector(`[data-st="${steps.length - 1}"]`)?.focus(); }
      if (b.dataset.pick === "day"){ day = b.dataset.v; sheet.querySelectorAll("[data-pick=day]").forEach(x => x.setAttribute("aria-pressed", x === b)); }
      if (b.dataset.close) closeSheet(); });
    sheet.querySelector("form").addEventListener("submit", e => { e.preventDefault();
      const name = $("#bName").value.trim(), list = steps.filter(s => s.title.trim());
      if (!name || list.length < 2){ toast("Poné un nombre y al menos dos pasos."); return; }
      const bid = uid8(), base = Date.now();
      list.forEach((st, i) => put("tasks", uid8(), { title:st.title.trim(), kind:st.kind, assignees:st.who, day:day || null, time:null, points:st.points, repeat:"none", status:"todo",

function completeTask(id, by, x, y){
  const t = store.tasks[id]; if (!t) return;
  const data = { ...t, status:"done", doneBy:by, doneAt:nowLocal() };
  // recurring: spawn next one once
  if (t.repeat && t.repeat !== "none" && !t.spawned){
    const from = t.day || todayS();
    const next = t.repeat === "weekly" ? addDays(from, 7) : t.repeat === "biweekly" ? addDays(from, 14) : (() => { const d = parse(from); d.setMonth(d.getMonth()+1); return ymd(d); })();

/* ============ Google Calendar ============ */
function gStamp(day, time, addMin = 0){
  const d = parse(day); const [h, m] = (time || "09:00").split(":").map(Number); d.setHours(h, m + addMin, 0, 0);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return ""; } })();
function gcalTaskUrl(t){
  const who = (t.assignees||[]).map(k => prof(k).name).join(" y ");
  const dates = t.time ? `${gStamp(t.day,t.time)}/${gStamp(t.day,t.time,30)}` : `${t.day.replace(/-/g,"")}/${addDays(t.day,1).replace(/-/g,"")}`;
  const q = new URLSearchParams({ action:"TEMPLATE", text:`${t.title}${who ? " · " + who : ""}`, dates, details:`Tarea de Nido · ${starStr(t.points||1)}`, ...(TZ ? { ctz:TZ } : {}) });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function gcalReminderUrl(r){
  const by = ["MO","TU","WE","TH","FR","SA","SU"];
  const now = new Date(), nd = (now.getDay()+6)%7;
  let off = 0; while (off < 7 && !(r.days||[]).includes((nd+off)%7)) off++;
  const day = addDays(todayS(), off);
  const q = new URLSearchParams({ action:"TEMPLATE", text:r.text, dates:`${gStamp(day,r.time)}/${gStamp(day,r.time,10)}`, details:"Aviso de Nido", recur:`RRULE:FREQ=WEEKLY;BYDAY=${(r.days||[]).map(d => by[d]).join(",")}`, ...(TZ ? { ctz:TZ } : {}) });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
const sig = t => [t.title, t.day, t.time, (t.assignees||[]).join("+")].join("|");
function csvWeek(list){
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const md = s => { const d = parse(s); return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`; };
  const t12 = (time, add = 0) => { let [h,m] = time.split(":").map(Number); m += add; h += Math.floor(m/60); m %= 60; const ap = h >= 12 && h < 24 ? "PM" : "AM"; const hh = ((h + 11) % 12) + 1; return `${pad(hh)}:${pad(m)} ${ap}`; };
  const rows = [["Subject","Start Date","Start Time","End Date","End Time","All Day Event","Description","Private"].join(",")];
  for (const t of list){
    const who = (t.assignees||[]).map(k => prof(k).name).join(" y ");
    rows.push([q(`${t.title}${who ? " · " + who : ""}`), md(t.day), t.time ? t12(t.time) : "", md(t.day), t.time ? t12(t.time, 30) : "", t.time ? "False" : "True", q(`Tarea de Nido · ${starStr(t.points||1)}`), "True"].join(","));
  }
  return rows.join("\r\n");
}

async function claim(k){

function resolveMe(){
  if (DEMO || !MY_UID) return;
  const k = KEYS.find(k => store.profiles[k]?.uid === MY_UID);
  if (k){ me = k; try { localStorage.setItem("nido-me-" + MY_UID, k); } catch {} return; }
  // Respaldo: lo que eligió en este dispositivo. Si la base no lo tiene, lo vuelve a guardar.
  let saved = null; try { saved = localStorage.getItem("nido-me-" + MY_UID); } catch {}
  if (saved && KEYS.includes(saved) && !store.profiles[saved]?.uid){

  }
}

    <form class="card" id="loginForm" style="width:100%;display:flex;flex-direction:column;gap:12px;text-align:left">
      <div class="field"><label for="lEmail">Mail</label><input class="inp" id="lEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="lPass">Contraseña</label><input class="inp" id="lPass" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="row" style="flex-wrap:wrap"><button class="btn pri" type="submit">Entrar</button><button class="btn ghost" type="button" id="signUpBtn">Crear cuenta</button></div>
      <p class="small" id="lMsg" style="margin:0;color:var(--ink-2)"></p></form></div>`;
  const msg = t => { $("#lMsg").textContent = t; };
  const creds = () => ({ email:$("#lEmail").value.trim(), password:$("#lPass").value });
  $("#loginForm").addEventListener("submit", async e => { e.preventDefault(); msg("Entrando…");
    const { error } = await SB.auth.signInWithPassword(creds());
    if (error) msg(error.message.includes("Invalid") ? "Mail o contraseña incorrectos." : error.message.includes("confirm") ? "Primero confirmá tu mail con el link que te llegó." : "No se pudo entrar: " + error.message);
    else location.reload(); });
  $("#signUpBtn").addEventListener("click", async () => {
    const c = creds(); if (!c.email || c.password.length < 6){ msg("Poné tu mail y una contraseña de al menos 6 caracteres."); return; }
    msg("Creando tu cuenta…");
    const { data, error } = await SB.auth.signUp({ ...c, options:{ emailRedirectTo: location.href } });
    if (error) msg("No se pudo crear la cuenta: " + error.message);
    else if (data.session) location.reload();
    else msg("¡Listo! Te mandamos un mail para confirmar. Tocá el link y después entrá acá con tu contraseña.");
  });
}
function renderSetup(){
  bareShell();
  $("#view").innerHTML = `<div class="claim"><h1>Armemos el nido</h1>
    <p class="muted" style="margin:0">Si sos la primera persona en entrar, creá el nido. Si te invitaron, abrí el link de invitación o pegá el código.</p>
    <button class="btn pri" id="createHH">Crear nuestro nido</button>
    <form id="joinForm" class="row" style="width:100%;max-width:360px"><input class="inp" id="joinCode" placeholder="Código de invitación" autocomplete="off"><button class="btn ghost" type="submit">Unirme</button></form>
    <p class="small" id="sMsg" style="margin:0;color:var(--ink-2)"></p>
    <button class="btn sm ghost" id="logoutBtn">Cerrar sesión</button></div>`;
  $("#createHH").addEventListener("click", async () => { const { error } = await SB.rpc("create_household"); if (error) $("#sMsg").textContent = "No se pudo crear: " + error.message; else location.reload(); });
  $("#joinForm").addEventListener("submit", async e => { e.preventDefault(); const { error } = await SB.rpc("join_household", { code:$("#joinCode").value }); if (error) $("#sMsg").textContent = error.message; else location.reload(); });
  $("#logoutBtn").addEventListener("click", () => SB.auth.signOut().then(() => location.reload()));
}
async function boot(){
  const cfg = window.NIDO_CONFIG || {};
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  if (!cfg.supabaseUrl || !window.supabase){ DEMO = true; seedDemo(); me = "pau"; ui.loaded = true; ui.pushState = "demo"; render(); setTimeout(checkSupplies, 800); setTimeout(ensureCatalog, 900); return; }
  SB = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
  const { data:{ session } } = await SB.auth.getSession();
  if (!session){ renderLogin(); return; }
  MY_UID = session.user.id;
  const join = new URLSearchParams(location.search).get("join");
  if (join){
    const { error } = await SB.rpc("join_household", { code:join });
    history.replaceState(null, "", location.pathname);
    if (error) setTimeout(() => toast(error.message), 500);
  }
  const { data:mem, error:memErr } = await SB.from("members").select("household_id, households(id, invite_code, cal_token)").eq("user_id", MY_UID).limit(1);
  if (memErr){ bareShell(); $("#view").innerHTML = `<div class="claim"><h1>No pude leer el nido</h1><p class="muted">La base de datos respondió: ${esc(memErr.message)}</p><p class="small muted">Revisá que hayas corrido todo supabase/schema.sql (incluidos los permisos del final).</p><button class="btn ghost" onclick="location.reload()">Reintentar</button></div>`; return; }
  if (!mem?.length || !mem[0].households){ renderSetup(); return; }
  HH = mem[0].households;
  loadOutbox();
  try { await loadAll(); } catch { ui.slow = true; }
  applyOutbox();
  resolveMe(); ui.loaded = true; render();
  flushOutbox();
  addEventListener("online", flushOutbox);
  setInterval(() => { if (Object.keys(outbox).length && !saving) flushOutbox(); }, 30000);
  subscribeLive();
  setTimeout(checkSupplies, 1500); setInterval(checkSupplies, 3600000);
  setTimeout(ensureCatalog, 2000);
  if (TZ && !homeCtx().tz) updateHome(h => h.tz ? h : ({ ...h, tz:TZ }));
  detectPush();
}
boot();

</script>
